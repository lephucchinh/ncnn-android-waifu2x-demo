apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

ext.getVersionCode = { base ->
    try {
        providers.exec {
            commandLine 'git', 'rev-list', '--count', base + '..HEAD'
        }.standardOutput.asText.get().toInteger()
    } catch (ignored) {
        10
    }
}

android {
    namespace 'pro.archiemeng.waifu2x'
    compileSdkVersion 35
    ndkVersion '26.2.11394342'
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        applicationId "pro.archiemeng.waifu2x"
        archivesBaseName = "$applicationId"

        minSdkVersion 24
        versionCode project.getVersionCode('665576c24caee5bca1bf4d8149223dccacbdd979')
        versionName "0.0.${project.getVersionCode('665576c24caee5bca1bf4d8149223dccacbdd979')}"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DUSE_PREBUILT_NCNN=ON", "-DUSE_SHARED_NCNN=OFF", "-DNCNN_VULKAN=ON"
            }
        }
    }

    // 👇 Thêm block này để Gradle/AGP hiểu rằng project build bằng JDK 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 👇 Kotlin JVM toolchain cũng dùng JDK 17 (chuẩn cho Android 15)
    kotlin {
        jvmToolchain(17)
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    // 👇 Giúp build ổn định hơn trên Android 15 (AGP 8.2+)
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    def coroutinesVersion = "1.7.3"   // cập nhật bản mới tương thích JDK 17
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
